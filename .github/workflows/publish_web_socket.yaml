# A CI configuration to publish package:web_socket to pub.dev.

name: Publish package:web_socket

on:
  push:
    tags:
      - 'web_socket-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: pkgs/web_socket
      use-flutter: false
