name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@fc3dd9a17a8e18b3b4aa5abac8a0f4a679fe2d57
    with:
      sdk: dev
      channel: dev
      flutter_packages: "pkgs/cronet_http,pkgs/cupertino_http,pkgs/ok_http"
    permissions:
      pull-requests: write
