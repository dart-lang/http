name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@78abf72b3cfcc7c6c822032d8915153019fe79b7 # main
    with:
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      sdk: dev
      channel: dev
      flutter_packages: "pkgs/cronet_http,pkgs/cupertino_http,pkgs/ok_http"
    permissions:
      pull-requests: write
